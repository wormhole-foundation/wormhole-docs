# Lychee link checker configuration
# https://lychee.cli.rs/configuration/

# Exclude patterns that cause false positives in CI
exclude = [
    # GitHub edit links get rate-limited (429) in CI
    'github\.com/.*/edit/',
    # GitHub login redirects
    'github\.com/login',
    # Localhost/example domains used in code samples
    'localhost',
    '127\.0\.0\.1',
    'example\.com',
    # Theme asset URLs that are not available during CI build
    'wormhole\.com/assets/images/',
]

# Exclude mail addresses
exclude_mail = true

# Don't fail on these status codes
accept = [200, 204, 429]

# Timeout for requests (in seconds)
timeout = 30

# Max number of redirects to follow
max_redirects = 10

# Number of retries for failed requests
max_retries = 3
